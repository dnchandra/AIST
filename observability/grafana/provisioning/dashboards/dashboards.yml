apiVersion: 1

providers:
  - name: 'AIST Enterprise Dashboards'
    orgId: 1
    folder: 'AIST'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/AIST
      foldersFromFilesStructure: false
