# AIST Multi-OS Enterprise Ansible Inventory

[rhel_nodes]
rhel10 ansible_host=192.168.1.25 ansible_user=root ansible_ssh_pass=Root@123 role=app-server
rhel9  ansible_host=192.168.1.18 ansible_user=root ansible_ssh_pass=Root@123 role=observability-hub

[windows_nodes]
win2025 ansible_host=192.168.1.13 ansible_user=Administrator ansible_password=Root@123 ansible_connection=winrm ansible_winrm_server_cert_validation=ignore role=auth-gateway
win2019 ansible_host=192.168.1.4  ansible_user=Administrator ansible_password=Root@123 ansible_connection=winrm ansible_winrm_server_cert_validation=ignore role=audit-db

[all:vars]
ansible_python_interpreter=/usr/bin/python3
datastore_target=Base_DS
thin_provisioning=true
local_ai_host=192.168.1.16

