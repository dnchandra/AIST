global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'component', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'ai-triage-webhook'

receivers:
  - name: 'ai-triage-webhook'
    webhook_configs:
      - url: 'http://192.168.1.15:8000/api/v1/alerts/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true
