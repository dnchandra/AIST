groups:
  - name: loanprocessai-application-alerts
    rules:
      - alert: LoanApiHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[2m]) / rate(http_requests_total[2m]) > 0.05
        for: 30s
        labels:
          severity: critical
          target_os: "rhel10"
          component: "loanprocessai-api"
        annotations:
          summary: "LoanProcessAI API HTTP 5xx error rate exceeds 5%"
          description: "API on {{ $labels.instance }} is returning elevated 5xx server errors."

      - alert: LoanApiHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[2m])) by (le)) > 2.0
        for: 30s
        labels:
          severity: warning
          target_os: "rhel10"
          component: "loanprocessai-api"
        annotations:
          summary: "LoanProcessAI API p95 latency exceeds 2 seconds"
          description: "Response times have degraded severely on {{ $labels.instance }}."

      - alert: LoanProcessAIServiceUnavailable
        expr: up{job="ticketflow-api-flask"} == 0
        for: 20s
        labels:
          severity: critical
          target_os: "rhel10"
          component: "loanprocessai-api"
        annotations:
          summary: "LoanProcessAI Backend on RHEL 10 is unreachable"
          description: "Core lending API on 192.168.1.130:5000 has stopped responding."

      - alert: AuthGatewayServiceUnavailable
        expr: up{service="auth-gateway"} == 0
        for: 20s
        labels:
          severity: critical
          target_os: "win2025"
          component: "auth-gateway"
        annotations:
          summary: "Auth Gateway on Windows Server 2025 is unreachable"
          description: "Auth Gateway service on 192.168.1.132:5001 has stopped responding."

      - alert: NotificationServiceUnavailable
        expr: up{job="notification-service"} == 0
        for: 20s
        labels:
          severity: critical
          target_os: "rhel10"
          component: "notification-service"
        annotations:
          summary: "Notification Service on RHEL 10 is unreachable"
          description: "Notification event broker service on 192.168.1.130:8080 has stopped responding."

      - alert: AuditServiceUnavailable
        expr: up{job="audit-service"} == 0
        for: 20s
        labels:
          severity: critical
          target_os: "win2019"
          component: "audit-service"
        annotations:
          summary: "Audit & DB Service on Windows Server 2019 is unreachable"
          description: "Audit and transaction logging service on 192.168.1.133:8088 has stopped responding."

      - alert: NotificationQueueBacklogHigh
        expr: rabbitmq_queue_messages_ready{queue="ticket.created"} > 500
        for: 1m
        labels:
          severity: warning
          target_os: "rhel10"
          component: "notification-service"
        annotations:
          summary: "RabbitMQ ticket.created queue depth > 500"
          description: "Unprocessed messages are accumulating. The Go consumer may be stalled or killed."

  - name: infrastructure-os-alerts
    rules:
      - alert: LinuxNodeHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 1m
        labels:
          severity: critical
          target_os: "linux"
          component: "node-exporter"
        annotations:
          summary: "High CPU usage (>85%) on Linux host"
          description: "Instance {{ $labels.instance }} is experiencing severe CPU starvation."

      - alert: WindowsNodeHighCPU
        expr: 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[2m])) * 100) > 85
        for: 1m
        labels:
          severity: critical
          target_os: "windows"
          component: "windows-exporter"
        annotations:
          summary: "High CPU usage (>85%) on Windows Server"
          description: "Windows instance {{ $labels.instance }} CPU utilization exceeds 85%."

      - alert: NodeDiskSpaceCritical
        expr: (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100 < 10) or (windows_logical_disk_free_bytes{volume="C:"} / windows_logical_disk_size_bytes{volume="C:"} * 100 < 10)
        for: 1m
        labels:
          severity: critical
          component: "storage"
        annotations:
          summary: "Disk free space is below 10%"
          description: "System drive on {{ $labels.instance }} is nearly full."

      - alert: SQLServerBlockedSessions
        expr: sqlserver_blocked_sessions > 3
        for: 30s
        labels:
          severity: warning
          target_os: "win2019"
          component: "sql-server"
        annotations:
          summary: "Active SQL Server blocking locks detected"
          description: "Multiple transactions are blocked in SQL Server on Windows Server 2019."

      - alert: WindowsServiceDown
        expr: windows_service_state{state="running",name=~"AuthGateway|AuditService|LoanPortal|WinRM|LanmanServer|EventLog|Schedule|MSSQLSERVER"} == 0
        for: 20s
        labels:
          severity: critical
          component: "windows-service"
        annotations:
          summary: "Windows Service {{ $labels.name }} is DOWN on {{ $labels.instance }}"
          description: "Critical service {{ $labels.name }} on {{ $labels.instance }} has stopped running."


